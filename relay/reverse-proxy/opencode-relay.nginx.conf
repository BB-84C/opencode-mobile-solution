# OpenCode relay reverse proxy (nginx).
# Replace opencode.example.com and the certificate paths with your own.
server {
    listen 443 ssl;
    server_name opencode.example.com;

    ssl_certificate     /etc/nginx/certs/your.pem;
    ssl_certificate_key /etc/nginx/certs/your.key;

    location / {
        proxy_pass http://127.0.0.1:4097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Preserve prompt streaming and SSE event streams: no buffering.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
    }
}
